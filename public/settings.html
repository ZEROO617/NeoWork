<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenAI 연결 · NeoWork</title><link rel="stylesheet" href="/style.css"><style>body{background:#f6f8fa}.setup{max-width:480px;margin:8vh auto;padding:36px;background:white;border:1px solid #e0e7ed;border-radius:14px}.back{font-size:13px;color:#008cdb;text-decoration:none}.setup h1{font-size:25px;margin:30px 0 14px}.setup p{font-size:14px;color:#718391;line-height:1.85}.setup label{display:block;font-size:13px;color:#425c70;margin:25px 0 9px}.key-input{display:flex;align-items:center;border:1px solid #cddbe5;border-radius:7px;overflow:hidden}.key-input:focus-within{border-color:#008cdb}.key-input input{width:100%;min-width:0;font-size:15px;padding:14px;border:0;outline:0;background:white}.key-input button{font-size:11px;color:#7b8d9b;white-space:nowrap;padding:12px}.setup .consent{display:flex;align-items:flex-start;gap:8px;font-size:12px;line-height:1.7;margin:18px 0}.consent input{margin-top:4px;flex-shrink:0}.setup button[type=submit]{font-size:14px;padding:14px;background:#008cdb;border-radius:7px;color:white;width:100%;margin-top:10px}#status{font-size:13px;line-height:1.8;margin-top:17px;color:#44708f}.warning{font-size:12px!important;color:#8796a3!important}.setup .privacy{font-size:12px;padding:14px;background:#f7f9fb;border-radius:7px;line-height:1.9;color:#80909d}@media(max-width:540px){.setup{margin:20px 16px;padding:26px}}</style></head><body><main class="setup"><a class="back" href="/">← 대화로 돌아가기</a><h1>OpenAI 연결</h1><p>발급받은 API 키를 아래에 입력하세요.<br>저장하면 NeoWork의 요약과 질문 답변에 사용됩니다.</p><form id="key-form"><label for="api-key">OpenAI API 키</label><div class="key-input"><input id="api-key" type="password" name="api-key" placeholder="sk-…" autocomplete="off" spellcheck="false" autocapitalize="none" maxlength="1010" required><button type="button" id="reveal" aria-pressed="false">표시</button></div><label class="consent"><input type="checkbox" id="consent" required><span>키를 이 NeoWork 사이트의 서버 저장소에 암호화해 저장하고 OpenAI 요청에 사용하는 것에 동의합니다.</span></label><button type="submit" id="save">키 저장하고 연결</button></form><div id="status" role="status" aria-live="polite"></div><p class="privacy">키는 채팅·소스 코드·브라우저 저장소에 기록되지 않습니다. 서버에서도 암호화해 저장하며, 저장한 키를 다시 조회하는 기능은 제공하지 않습니다.</p><p class="warning">OpenAI API 사용 요금은 본인의 OpenAI 프로젝트에 별도로 청구됩니다. 현재 서버 환경변수에 키가 설정되어 있다면 해당 키가 우선 사용됩니다.</p></main><script src="/settings.js"></script></body></html>
